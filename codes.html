{% extends "base.html" %}{% block content %}<section class="card"><h1>Generate codes</h1><form method="post"><label>Unlock resource<select name="resource_id" required>{% for r in resources %}<option value="{{ r.id }}">{{ r.title }}</option>{% endfor %}</select></label><label>Number of codes<input type="number" name="count" min="1" max="100" value="5"></label><label>Uses per code<input type="number" name="use_limit" min="1" max="10000" value="1"></label><label>Expires in days (0 = never)<input type="number" name="days" min="0" value="7"></label><button>Generate codes</button></form>{% if generated %}<h2>Generated codes</h2><ul>{% for code in generated %}<li><code>{{ code }}</code></li>{% endfor %}</ul>{% endif %}</section>{% endblock %}
