{% extends "base.html" %}{% block content %}<h1>Resources</h1><p>Browse editing packs.</p><div class="grid">{% for r in resources %}<article class="card"><h3>{{ r.title }}</h3><p>{{ r.description }}</p><small>🔒 {{ r.boost_count }} boosts required</small><a class="button" href="/resource/{{ r.id }}">View details →</a></article>{% else %}<p>No resources uploaded yet.</p>{% endfor %}</div>{% endblock %}
